<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roupas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>👕Loja de Roupas👚</h1>
    </header> 
        <main class="carrossel">

            <div class="trilho">
                
                <div class="slide">
                    <img src="img/blusa" alt="blusa">
                    <h2>Camiseta</h2>
                    <p class="preco">R$ 67,99</p>
                </div> 

                <div class="slide">
                    <img src="img/calça.jpg" alt="calca">
                    <h2>Calça</h2>
                    <p class="preco">R$ 49,99</p>
                </div>

                <div class="slide">
                    <img src="img/jaqueta.jpg" alt="jaqueta">
                    <h2>Jaqueta</h2>
                    <p class="preco">R$ 59, 99</p>
                </div>

                <div class="slide">
                    <img src="img/sapato.jpg" alt="sapato">
                    <h2>Sapato</h2>
                    <p class="preco">R$ 99,99</p>
                </div>

                <div class="slide">
                    <img src="img/vestido.jpg" alt="vestido">
                    <h2>Vestido</h2>
                    <p class="preco">R$ 199,99</p>
                </div>
                </div>
        </main>
    

    <script src="js/script.js"></script>
</body>
</html>
